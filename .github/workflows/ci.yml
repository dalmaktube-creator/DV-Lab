name: DV Lab CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit, protocol, TLS and update guard regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Syntax validation
        run: |
          python3 -m compileall -q dvlab scripts
          bash -n install.sh scripts/ci-isolation.sh
  ubuntu-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rootless namespaces, TUN, cgroups and nft on disposable runner
        run: sudo bash scripts/ci-isolation.sh
