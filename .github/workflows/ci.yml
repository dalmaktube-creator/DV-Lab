name: DV Lab CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit, protocol, TLS and update guard regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Syntax validation
        run: |
          python3 -m compileall -q dvlab scripts
          bash -n install.sh scripts/ci-isolation.sh scripts/ci-hub22.sh
  ubuntu-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rootless namespaces, TUN, cgroups and nft on disposable runner
        run: python3 scripts/ci-report.py
  ubuntu-22-isolation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rootless namespaces, TUN, cgroups and nft on disposable runner
        run: python3 scripts/ci-report.py
  python310-terminal:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.10 controlling-terminal regression (no installation)
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m unittest discover -s tests -p test_terminal.py -v
  ubuntu-22-hub:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Full Python 3.10 regression suite
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Install real hub, TLS, MCP and pinned update broker on disposable Jammy
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_SHA="$GITHUB_SHA" bash scripts/ci-hub22.sh

  ubuntu-24-hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Full Python 3.12 regression suite
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Install real hub, TLS, MCP and pinned update broker on disposable Noble
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_SHA="$GITHUB_SHA" DV_LAB_CI_MIGRATION=1 bash scripts/ci-hub22.sh

  ubuntu-22-node-install:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Full node installation, TLS enrollment, MCP execution and remote resources
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_SHA="$GITHUB_SHA" bash scripts/ci-node-install.sh

  ubuntu-24-node-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Full node installation, TLS enrollment, MCP execution and remote resources
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_SHA="$GITHUB_SHA" bash scripts/ci-node-install.sh
